name: Release packages
on:
  push:
    branches: [main]
    paths:
      - "*.zip.b64"
      - "*.zip.b64.*"
      - "suite.json"
      - ".github/workflows/release-packages.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode zips
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in *.zip.b64; do
            base64 -d "$f" > "dist/${f%.b64}"
            echo "decoded $f -> dist/${f%.b64} ($(wc -c < "dist/${f%.b64}") bytes)"
          done
          prefixes=$(ls *.zip.b64.* 2>/dev/null | sed 's/\.zip\.b64\.[0-9]*$//' | sort -u)
          for prefix in $prefixes; do
            cat ${prefix}.zip.b64.* | tr -d '\n' | base64 -d > "dist/${prefix}.zip"
            echo "joined ${prefix} $(wc -c < dist/${prefix}.zip) bytes"
          done
          cp -f suite.json dist/suite.json
          ls -la dist
      - name: Tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" dist/* --title "$TAG" --notes "S&P Suite packages for WordPress. Use https://raw.githubusercontent.com/adamjyo/sp-suite-packages/main/suite.json as the Suite source."
